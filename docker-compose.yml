services:
  postgres:
    image: postgres:16-alpine
    container_name: stock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockuser
      POSTGRES_PASSWORD: stockpass
      POSTGRES_DB: stocktracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: stock-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: stock-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # Keep the heap small — this is running on a free-tier box (1GB RAM on t2.micro)
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  backend:
    build: ./backend
    container_name: stock-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - elasticsearch
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"

volumes:
  pgdata:
  esdata:
